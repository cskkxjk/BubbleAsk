<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="128" height="128" role="img" aria-label="Bubble Ask">
  <defs>
    <linearGradient id="plate" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0" stop-color="#EDF1FF"/>
      <stop offset="1" stop-color="#D7E0FF"/>
    </linearGradient>
    <linearGradient id="skin" x1="0.15" y1="0.1" x2="0.85" y2="0.95">
      <stop offset="0" stop-color="#7089FF"/>
      <stop offset="1" stop-color="#3D57EB"/>
    </linearGradient>

    <!-- 身体轮廓：肚皮用这个裁剪，才能干净地贴着身体走 -->
    <clipPath id="bodyClip">
      <path d="M452 296
        C452 230 402 186 334 186
        C264 186 206 228 186 274
        L186 326
        C206 350 264 372 330 372
        C400 372 452 344 452 296 Z"/>
    </clipPath>
  </defs>

  <rect width="512" height="512" rx="112" ry="112" fill="url(#plate)"/>

  <g transform="rotate(-6 256 280)">
    <!-- 尾鳍：两片，从上尾柄张开到左上、左下 -->
    <path fill="url(#skin)" d="
      M196 274
      C156 236 110 200 66 184
      C52 180 44 194 54 206
      C76 244 94 274 106 296
      C92 316 76 342 56 372
      C48 386 60 398 72 392
      C120 368 164 334 198 306
      Z"/>

    <!-- 身体 -->
    <path fill="url(#skin)" d="M452 296
      C452 230 402 186 334 186
      C264 186 206 228 186 274
      L186 326
      C206 350 264 372 330 372
      C400 372 452 344 452 296 Z"/>

    <!-- 肚皮：一个大椭圆，被身体裁掉多余部分，形成负空间的弧线 -->
    <g clip-path="url(#bodyClip)">
      <ellipse cx="336" cy="424" rx="214" ry="126" transform="rotate(-7 336 424)" fill="#ffffff"/>
    </g>

    <!-- 胸鳍：贴在肚皮前侧的深色小鳍 -->
    <path fill="url(#skin)" d="M268 330 C286 344 306 356 326 364 C304 368 276 362 258 348 C250 342 256 328 268 330 Z" opacity="0.95"/>

    <!-- 眼睛：白圈 + 蓝瞳 -->
    <circle cx="374" cy="248" r="26" fill="#ffffff"/>
    <circle cx="379" cy="251" r="12" fill="#3D57EB"/>

    <!-- 嘴角：一小段浅色弧，收住吻部 -->
    <path d="M434 314 C442 320 446 328 444 336" stroke="#ffffff" stroke-width="8" stroke-linecap="round" fill="none" opacity="0.8"/>
  </g>

</svg>
