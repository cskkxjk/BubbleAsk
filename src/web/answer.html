<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bubble Ask</title>
<style>
  /* 这套 HTML/CSS 是纯前端资产：不依赖任何宿主 API，Windows 用 WebView2 承载，
     以后上 macOS 可以直接塞进 WKWebView / Tauri / Electron，一行不用改。 */
  :root {
    --ink: #1f2937;
    --ink-dim: #6b7280;
    --ink-faint: #9ca3af;
    --line: #e2e6ef;
    --line-soft: #eef1f6;
    --accent: #4d6bfe;
    --accent-soft: #eff3ff;
    --accent-line: #d6defc;
    --danger: #d64545;
    --code-bg: #f6f7fb;
    --quote-bg: #f7f9ff;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: #fff;
    color: var(--ink);
    font: 400 14px/1.72 "Microsoft YaHei UI", "PingFang SC", system-ui, -apple-system, sans-serif;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
  }

  /* ---------- 标题栏 ---------- */
  header {
    flex: none;
    height: 46px;
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 0 10px 0 12px;
    border-bottom: 1px solid var(--line);
    background: #fff;
    cursor: default;
    user-select: none;
  }
  header .whale { width: 30px; height: 30px; object-fit: contain; opacity: .95; flex: none; }
  header .title {
    flex: 1 1 auto;
    min-width: 0;
    font-weight: 600;
    font-size: 13.5px;
    color: var(--ink);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .ghost {
    flex: none;
    border: 0;
    background: transparent;
    color: var(--ink-dim);
    font: inherit;
    font-size: 12px;
    height: 28px;
    padding: 0 9px;
    border-radius: 8px;
    cursor: pointer;
  }
  .ghost:hover { background: #f3f5fa; color: var(--ink); }

  /* ---------- 正文 ---------- */
  main {
    flex: 1 1 auto;
    min-height: 0;
    overflow-y: auto;
    overflow-x: hidden;
    padding: 14px 18px 10px;
    scroll-behavior: auto;
  }
  main::-webkit-scrollbar { width: 10px; }
  main::-webkit-scrollbar-thumb {
    background: #d8dce6;
    border-radius: 6px;
    border: 3px solid #fff;
  }
  .turn { margin-bottom: 12px; }
  .ask {
    display: flex;
    justify-content: flex-end;
    margin-bottom: 12px;
  }
  .ask .bubble {
    max-width: 84%;
    padding: 9px 13px;
    border-radius: 14px 14px 4px 14px;
    background: var(--accent-soft);
    border: 1px solid var(--accent-line);
    white-space: pre-wrap;
    word-break: break-word;
    font-size: 13.5px;
  }
  .reasoning {
    margin: 0 0 10px;
    padding: 8px 12px;
    border-left: 2px solid var(--accent-line);
    background: var(--quote-bg);
    border-radius: 0 8px 8px 0;
    color: var(--ink-dim);
    font-size: 12.5px;
    white-space: pre-wrap;
    word-break: break-word;
    max-height: 180px;
    overflow: auto;
  }
  .reasoning::before {
    content: "深度思考";
    display: block;
    font-size: 11px;
    color: var(--ink-faint);
    margin-bottom: 4px;
    letter-spacing: .04em;
  }
  .error {
    color: var(--danger);
    font-size: 13px;
    padding: 6px 0;
  }
  .note { color: var(--ink-faint); font-size: 12px; padding: 4px 0; }

  /* ---------- Markdown ---------- */
  .md > *:first-child { margin-top: 0; }
  .md > *:last-child { margin-bottom: 0; }
  .md p { margin: 0 0 10px; }
  .md h1, .md h2, .md h3, .md h4, .md h5, .md h6 {
    margin: 16px 0 8px;
    line-height: 1.4;
    font-weight: 600;
  }
  .md h1 { font-size: 19px; }
  .md h2 { font-size: 17px; }
  .md h3 { font-size: 15.5px; }
  .md h4, .md h5, .md h6 { font-size: 14px; }
  .md ul, .md ol { margin: 0 0 10px; padding-left: 22px; }
  .md li { margin: 3px 0; }
  .md li > ul, .md li > ol { margin: 3px 0; }
  .md blockquote {
    margin: 0 0 10px;
    padding: 6px 12px;
    border-left: 3px solid var(--accent-line);
    background: var(--quote-bg);
    color: var(--ink-dim);
    border-radius: 0 8px 8px 0;
  }
  .md code {
    font: 12.5px/1.5 "Cascadia Mono", "Consolas", "SF Mono", monospace;
    background: var(--code-bg);
    border: 1px solid var(--line-soft);
    border-radius: 5px;
    padding: 1px 5px;
  }
  .md pre {
    margin: 0 0 12px;
    padding: 10px 12px;
    background: var(--code-bg);
    border: 1px solid var(--line-soft);
    border-radius: 10px;
    overflow: auto;
  }
  .md pre code {
    background: transparent;
    border: 0;
    padding: 0;
    display: block;
    white-space: pre;
  }
  .md table {
    border-collapse: collapse;
    margin: 0 0 12px;
    font-size: 13px;
    width: 100%;
  }
  .md th, .md td {
    border: 1px solid var(--line);
    padding: 6px 9px;
    text-align: left;
  }
  .md th { background: var(--code-bg); font-weight: 600; }
  .md a { color: var(--accent); text-decoration: none; }
  .md a:hover { text-decoration: underline; }
  .md hr { border: 0; border-top: 1px solid var(--line); margin: 14px 0; }
  .md strong { font-weight: 600; }

  .caret {
    display: inline-block;
    width: 7px;
    height: 15px;
    margin-left: 2px;
    vertical-align: -2px;
    background: var(--accent);
    border-radius: 2px;
    animation: blink 1s steps(2, start) infinite;
  }
  @keyframes blink { to { visibility: hidden; } }

  /* ---------- 输入区 ---------- */
  footer {
    flex: none;
    padding: 10px 14px 12px;
    border-top: 1px solid var(--line);
    background: #fff;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .belly {
    flex: 1 1 auto;
    min-width: 0;
    display: flex;
    align-items: center;
    padding: 0 12px;
    height: 38px;
    border: 1px solid var(--accent-line);
    border-radius: 12px;
    background: var(--accent-soft);
  }
  .belly:focus-within { background: #fff; border-color: var(--accent); box-shadow: 0 0 0 3px rgba(77, 107, 254, .14); }
  .belly input {
    flex: 1 1 auto;
    min-width: 0;
    border: 0;
    outline: none;
    background: transparent;
    color: var(--ink);
    font: inherit;
    font-size: 13.5px;
  }
  .belly input::placeholder { color: var(--ink-faint); }
  .send {
    flex: none;
    height: 38px;
    padding: 0 16px;
    border: 0;
    border-radius: 12px;
    background: var(--accent);
    color: #fff;
    font: inherit;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
  }
  .send:hover { filter: brightness(1.05); }
  .send:disabled { opacity: .55; cursor: default; }
</style>
</head>
<body>

<script>
  //#region 极简 Markdown 渲染
  // 只做对话里真会出现的语法：标题、列表、引用、表格、围栏代码、行内代码、加粗、
  // 斜体、链接、分隔线。刻意不引第三方库 —— 这段要能被原样搬到别的宿主里。
  function escapeHtml(text) {
    return String(text)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
  }

  function inline(text) {
    let out = escapeHtml(text)
    // 行内代码先抽出来，避免里面的 * _ 被当成强调
    const codes = []
    out = out.replace(/`([^`]+)`/g, function (_, code) {
      codes.push(code)
      return '\u0000' + (codes.length - 1) + '\u0000'
    })
    out = out.replace(/\[([^\]]+)\]\((https?:[^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noreferrer">$1</a>')
    out = out.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
    out = out.replace(/(^|[^*])\*([^*\n]+)\*/g, '$1<em>$2</em>')
    out = out.replace(/~~([^~]+)~~/g, '<del>$1</del>')
    out = out.replace(/\u0000(\d+)\u0000/g, function (_, index) {
      return '<code>' + codes[Number(index)] + '</code>'
    })
    return out
  }

  function renderTable(lines) {
    const rows = lines.map(function (line) {
      return line.trim().replace(/^\|/, '').replace(/\|$/, '').split('|').map(function (cell) {
        return cell.trim()
      })
    })
    if (rows.length < 2) return null
    const head = rows[0]
    const body = rows.slice(2)
    let html = '<table><thead><tr>'
    head.forEach(function (cell) { html += '<th>' + inline(cell) + '</th>' })
    html += '</tr></thead><tbody>'
    body.forEach(function (row) {
      html += '<tr>'
      head.forEach(function (_, index) { html += '<td>' + inline(row[index] || '') + '</td>' })
      html += '</tr>'
    })
    return html + '</tbody></table>'
  }

  function renderMarkdown(source) {
    const lines = String(source || '').replace(/\r\n/g, '\n').split('\n')
    let html = ''
    let index = 0
    let paragraph = []
    let list = null

    function flushParagraph() {
      if (paragraph.length === 0) return
      html += '<p>' + inline(paragraph.join('\n')).replace(/\n/g, '<br>') + '</p>'
      paragraph = []
    }
    function flushList() {
      if (!list) return
      html += '</' + list + '>'
      list = null
    }

    while (index < lines.length) {
      const line = lines[index]

      // 围栏代码块
      const fence = line.match(/^\s*```(.*)$/)
      if (fence) {
        flushParagraph()
        flushList()
        const body = []
        index += 1
        while (index < lines.length && !/^\s*```\s*$/.test(lines[index])) {
          body.push(lines[index])
          index += 1
        }
        index += 1
        html += '<pre><code>' + escapeHtml(body.join('\n')) + '</code></pre>'
        continue
      }

      // 表格：至少两行且第二行是分隔线
      if (/^\s*\|/.test(line) && index + 1 < lines.length && /^\s*\|?[\s:|-]+\|/.test(lines[index + 1])) {
        flushParagraph()
        flushList()
        const block = []
        while (index < lines.length && /^\s*\|/.test(lines[index])) {
          block.push(lines[index])
          index += 1
        }
        const table = renderTable(block)
        html += table || ('<p>' + inline(block.join(' ')) + '</p>')
        continue
      }

      const heading = line.match(/^\s*(#{1,6})\s+(.*)$/)
      if (heading) {
        flushParagraph()
        flushList()
        const level = heading[1].length
        html += '<h' + level + '>' + inline(heading[2]) + '</h' + level + '>'
        index += 1
        continue
      }

      const quote = line.match(/^\s*>\s?(.*)$/)
      if (quote) {
        flushParagraph()
        flushList()
        const body = []
        while (index < lines.length && /^\s*>\s?/.test(lines[index])) {
          body.push(lines[index].replace(/^\s*>\s?/, ''))
          index += 1
        }
        html += '<blockquote>' + inline(body.join('\n')).replace(/\n/g, '<br>') + '</blockquote>'
        continue
      }

      if (/^\s*(-{3,}|\*{3,})\s*$/.test(line)) {
        flushParagraph()
        flushList()
        html += '<hr>'
        index += 1
        continue
      }

      const ordered = line.match(/^\s*\d+[.)]\s+(.*)$/)
      const bullet = line.match(/^\s*[-*+]\s+(.*)$/)
      if (ordered || bullet) {
        flushParagraph()
        const kind = ordered ? 'ol' : 'ul'
        if (list !== kind) {
          flushList()
          html += '<' + kind + '>'
          list = kind
        }
        html += '<li>' + inline((ordered || bullet)[1]) + '</li>'
        index += 1
        continue
      }

      if (/^\s*$/.test(line)) {
        flushParagraph()
        flushList()
        index += 1
        continue
      }

      flushList()
      paragraph.push(line)
      index += 1
    }

    flushParagraph()
    flushList()
    return html
  }
  //#endregion

  //#region 视图状态
  const els = {
    stream: document.getElementById('stream'),
    title: document.getElementById('title'),
    input: document.getElementById('input'),
    send: document.getElementById('send'),
    copy: document.getElementById('copy'),
    close: document.getElementById('close'),
  }

  let current = null      // 当前回答：{ wrap, reasoningEl, bodyEl, raw }
  let stickToBottom = true
  let renderFrame = 0

  els.stream.addEventListener('scroll', function () {
    const gap = els.stream.scrollHeight - els.stream.scrollTop - els.stream.clientHeight
    stickToBottom = gap < 40
  })

  function scrollToBottom() {
    if (!stickToBottom) return
    els.stream.scrollTop = els.stream.scrollHeight
  }

  function reportHeight() {
    // 让宿主把窗口高度贴合内容（Markdown 渲染后的真实高度，不是按字数估）
    const height = Math.min(560, Math.max(140, document.body.scrollHeight))
    post('height:' + height)
  }

  function post(message) {
    // 宿主通道：WebView2 用 chrome.webview；别的宿主（Tauri/Electron）换掉这一处即可。
    // 协议是纯字符串（"followup:…"），宿主那边不用解析 JSON。
    try {
      if (window.chrome && window.chrome.webview && window.chrome.webview.postMessage) {
        window.chrome.webview.postMessage(message)
      } else if (window.__hostPost) {
        window.__hostPost(message)
      }
    } catch (error) {
      /* 没有宿主就静默 */
    }
  }

  function scheduleRender() {
    if (renderFrame) return
    renderFrame = requestAnimationFrame(function () {
      renderFrame = 0
      if (!current) return
      const stick = stickToBottom
      current.bodyEl.innerHTML = renderMarkdown(current.raw) + (current.streaming ? '<span class="caret"></span>' : '')
      if (stick) scrollToBottom()
      reportHeight()
    })
  }

  function scrollOrRender() {
    scrollToBottom()
    scheduleRender()
  }
  //#endregion

  //#region 宿主 API（C# 通过 ExecuteScriptAsync 调这些）
  window.ds = {
    setTitle: function (text) {
      els.title.textContent = text || 'Bubble Ask'
      els.title.title = text || ''
    },
    beginTurn: function (question) {
      const turn = document.createElement('div')
      turn.className = 'turn'

      const ask = document.createElement('div')
      ask.className = 'ask'
      const bubble = document.createElement('div')
      bubble.className = 'bubble'
      bubble.textContent = question || ''
      ask.appendChild(bubble)
      turn.appendChild(ask)

      const reasoningEl = document.createElement('div')
      reasoningEl.className = 'reasoning'
      reasoningEl.style.display = 'none'
      turn.appendChild(reasoningEl)

      const bodyEl = document.createElement('div')
      bodyEl.className = 'md'
      turn.appendChild(bodyEl)

      els.stream.appendChild(turn)
      current = { wrap: turn, reasoningEl: reasoningEl, bodyEl: bodyEl, raw: '', reasoning: '', streaming: true }
      stickToBottom = true
      scrollOrRender()
      return true
    },
    appendReasoning: function (delta) {
      if (!current) return false
      current.reasoning += String(delta || '')
      current.reasoningEl.style.display = ''
      current.reasoningEl.textContent = current.reasoning
      scrollToBottom()
      reportHeight()
      return true
    },
    appendAnswer: function (delta) {
      if (!current) return false
      current.raw += String(delta || '')
      scheduleRender()
      return true
    },
    endTurn: function () {
      if (!current) return false
      current.streaming = false
      scheduleRender()
      setBusy(false)
      return true
    },
    failTurn: function (message) {
      if (!current) return false
      current.streaming = false
      const error = document.createElement('div')
      error.className = 'error'
      error.textContent = '⚠ ' + (message || '出错了')
      current.bodyEl.appendChild(error)
      scheduleRender()
      setBusy(false)
      return true
    },
    note: function (text) {
      const note = document.createElement('div')
      note.className = 'note'
      note.textContent = text || ''
      els.stream.appendChild(note)
      scrollToBottom()
      reportHeight()
      return true
    },
    focusInput: function () {
      els.input.focus()
      return true
    },
    setBusy: function (busy) {
      setBusy(!!busy)
      return true
    },
    bodyText: function () {
      return current ? current.raw : ''
    },
  }
  //#endregion

  //#region 页脚交互
  function setBusy(busy) {
    els.send.disabled = !!busy
    els.input.disabled = !!busy
  }

  function submit() {
    const text = els.input.value.trim()
    if (!text) return
    els.input.value = ''
    setBusy(true)
    post('followup:' + text)
  }

  els.send.addEventListener('click', submit)
  els.input.addEventListener('keydown', function (event) {
    if (event.key === 'Enter' && !event.isComposing) {
      event.preventDefault()
      submit()
    }
  })
  els.copy.addEventListener('click', function () {
    const raw = current ? current.raw : ''
    post('copy:' + raw)
  })
  els.close.addEventListener('click', function () {
    post('close:')
  })

  // 无边框窗口：按住标题栏拖动（由宿主处理，这里只上报）
  document.querySelector('header').addEventListener('mousedown', function (event) {
    if (event.button !== 0) return
    if (event.target.closest('button')) return
    post('drag:')
  })

  reportHeight()
  //#endregion
</script>
</body>
</html>
