<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="16" height="16" role="img" aria-label="Bubble Ask">
  <!-- 16px 专用：细节全砍掉，只留高对比剪影。缩小的不是绘制尺寸，而是信息量。 -->
  <rect width="512" height="512" rx="96" ry="96" fill="#4D6BFE"/>
  <g transform="rotate(-6 256 256)">
    <!-- 尾巴 -->
    <path fill="#ffffff" d="M206 268 C162 226 108 190 62 178 C46 174 40 190 52 204 C74 244 92 274 104 296 C90 318 72 344 52 374 C42 390 56 402 70 394 C120 368 168 330 208 302 Z"/>
    <!-- 身体 -->
    <path fill="#ffffff" d="M456 292 C456 222 402 178 332 178 C258 178 200 222 182 272 L182 328 C204 354 262 380 330 380 C404 380 456 350 456 292 Z"/>
    <!-- 眼睛：小尺寸下只留一个蓝点 -->
    <circle cx="372" cy="252" r="26" fill="#4D6BFE"/>
  </g>
</svg>
