<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <title>Bubble Ask</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header>
      <img src="../icons/icon32.png" alt="" width="20" height="20" />
      <div class="titles">
        <strong>页面提问</strong>
        <span id="page-title" class="muted">正在读取页面…</span>
      </div>
    </header>

    <section class="provider-row">
      <label class="label" for="provider">发送到</label>
      <select id="provider"></select>
    </section>

    <section id="summary-row" class="muted" hidden>
      <span id="summary"></span>
    </section>

    <section id="selection-box" hidden>
      <div class="label">选中的文字</div>
      <pre id="selection"></pre>
    </section>

    <section>
      <label class="label" for="question">我的问题（留空用默认问题）</label>
      <textarea id="question" rows="3" placeholder="例如：这段配置的作用是什么？"></textarea>
    </section>

    <section class="actions">
      <button id="send" class="primary">发送到选中的服务方</button>
      <button id="copy">复制提问</button>
    </section>

    <section class="actions secondary">
      <button id="open-window">打开该服务方窗口</button>
    </section>

    <p id="status" class="muted"></p>

    <footer class="muted">
      每家服务方一个独立窗口，扩展只复用它自己创建的窗口，已打开的标签页保持原样。关掉窗口后再次发送或点上面的按钮会重新打开。首次使用某家服务方需要在窗口里登录一次。
    </footer>

    <!-- 兼容层要在模块脚本之前加载：老的 Chromium 里 runtime.sendMessage 没有 Promise -->
    <script src="../content/compat.js"></script>
    <script type="module" src="popup.js"></script>
  </body>
</html>
